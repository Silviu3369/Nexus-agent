[package]
name = "nexus-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt", "net"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
