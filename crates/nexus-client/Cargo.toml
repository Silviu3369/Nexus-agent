[package]
name = "nexus-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexus-protocol = { version = "0.1.0", path = "../nexus-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tarpc = { version = "0.38.0", features = ["serde-transport", "serde1"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "windows-sys"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization"] }
