[package]
name = "nexus-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nexus-core = { version = "0.1.0", path = "../nexus-core" }
nexus-protocol = { version = "0.1.0", path = "../nexus-protocol" }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync"] }
uuid = "1.28.0"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.28.0", features = ["v4"] }
