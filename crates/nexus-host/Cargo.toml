[package]
name = "nexus-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
nexus-core = { version = "0.1.0", path = "../nexus-core" }
nexus-protocol = { version = "0.1.0", path = "../nexus-protocol" }
nexus-providers = { version = "0.1.0", path = "../nexus-providers" }
nexus-storage = { version = "0.1.0", path = "../nexus-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tarpc = { version = "0.38.0", features = ["serde-transport", "serde1"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "windows-sys", "signal"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }
zeroize = "1.9.0"

[dev-dependencies]
nexus-client = { path = "../nexus-client" }
tokio = { version = "1.53.3", features = ["test-util"] }
uuid = { version = "1.28.0", features = ["v4"] }
