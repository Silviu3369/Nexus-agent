[package]
name = "desktop"
version = "0.1.0"
description = "Nexus desktop shell: Tauri window and narrow bridge to nexus-host"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nexus-client = { version = "0.1.0", path = "../../../crates/nexus-client" }
nexus-protocol = { version = "0.1.0", path = "../../../crates/nexus-protocol" }
specta = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# Release profile tuning lives in the workspace root Cargo.toml now that
# this crate is a workspace member (see tauri.app/concept/size).
